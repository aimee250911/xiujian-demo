name: Deploy Xiujian to GitHub Pages

on:
  push:
    branches: [main]
    paths: [xiujian-site.zip, .github/workflows/deploy.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the release
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Extract the static site
        run: unzip -q xiujian-site.zip -d site
      - name: Upload the site
        uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - name: Deploy the site
        id: deployment
        uses: actions/deploy-pages@v4
